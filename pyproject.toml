[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banking-doc-intelligence"
version = "0.1.0"
description = "Banking Agentic Platform MVP for Multimodal PDF Analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "langchain>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-community>=0.0.10",
    "openai>=1.0.0",
    "pymupdf>=1.23.0",
    "pymupdf4llm>=0.0.2",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.15",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.3",
    "pybreaker>=1.2.0",
    "structlog>=23.2.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=0.0.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.9.1",
    "mypy>=1.5.1",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
